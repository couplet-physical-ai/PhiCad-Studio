# Roadrunner CI (Woodpecker + Dagger, https://cicd.apps.example.com): every job of the former
# .github/workflows/ci.yml. typecheck-and-test (npm ci, @openpcb dist rebuild, typecheck, codegen
# drift checks, Bun backend tests, Vitest frontend tests) and e2e (Playwright chromium, after it).
# corelib-trust (bun scripts/fetch-core-library.ts) needs an authenticated gh, so it runs on
# pushes to main and manual runs only, in a container through .woodpecker/release.sh with the
# repo secret github_release_token as a Dagger secret (a PR step gets no secret into ci-runner).
# `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: pull_request
  - event: [push, manual]
    branch: main
steps:
  - name: typecheck-and-test
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 npm --src=. --repo="$${CI_REPO_NAME,,}" --node=22
        --dep-include=electron/package.json,src/core/backend/package.json,src/core/frontend/package.json,src/shared/tscircuit-runtime/package.json
        --npm-registry=https://npm.dev.example.com/
        --run='npm install -g bun@1.3.0 && for pkg in kicad-parsers rendering-core kicad-import step-to-glb r3f-eda-canvas opclib-pack command-pattern contracts; do dir="node_modules/@openpcb/$$pkg"; if [ -d "$$dir" ] && [ -f "$$dir/tsconfig.build.json" ]; then (cd "$$dir" && npx --no-install tsc -p tsconfig.build.json) || (cd "$$dir" && npx tsc -p tsconfig.build.json); fi; done && npm run typecheck && git init -q && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm checkout && npm run gen:check && npm run gen:contracts -- --check && npm run test:backend && npm run test:react'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
  - name: e2e
    image: bash
    depends_on: [typecheck-and-test]
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 npm --src=. --repo="$${CI_REPO_NAME,,}" --node=22
        --dep-include=electron/package.json,src/core/backend/package.json,src/core/frontend/package.json,src/shared/tscircuit-runtime/package.json
        --npm-registry=https://npm.dev.example.com/
        --run='npm install -g bun@1.3.0 && for pkg in kicad-parsers rendering-core kicad-import step-to-glb r3f-eda-canvas opclib-pack command-pattern contracts; do dir="node_modules/@openpcb/$$pkg"; if [ -d "$$dir" ] && [ -f "$$dir/tsconfig.build.json" ]; then (cd "$$dir" && npx --no-install tsc -p tsconfig.build.json) || (cd "$$dir" && npx tsc -p tsconfig.build.json); fi; done && npx playwright install --with-deps chromium && npm run test:e2e'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
  - name: corelib-trust
    image: bash
    depends_on: []
    when:
      - event: [push, manual]
    environment:
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - bash .woodpecker/release.sh corelib-trust
